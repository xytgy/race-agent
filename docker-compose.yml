services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: raceagent-backend
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ~/.cache/huggingface:/root/.cache/huggingface
      - backend-pip-packages:/usr/local/lib/python3.10/site-packages

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: raceagent-frontend
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000
      - DATA_DIR=/app/data
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
      - ./data:/app/data
    depends_on:
      - backend

  frontend_web:
    build:
      context: ./frontend_web
      dockerfile: Dockerfile
    container_name: raceagent-frontend-web
    environment:
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: raceagent-nginx
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx:/etc/nginx/templates:ro
    depends_on:
      - backend
      - frontend_web

volumes:
  backend-pip-packages:
